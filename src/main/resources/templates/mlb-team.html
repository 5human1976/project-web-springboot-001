<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLB チーム詳細</title>
    <style>
        section { margin: 24px 0; }
        dt { font-weight: bold; }
        dd { margin: 0 0 10px; }
        form { margin-bottom: 16px; }
        .table-scroll { overflow-x: auto; }
        table.yearly-stats { border-collapse: collapse; }
        table.yearly-stats th, table.yearly-stats td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: center;
            white-space: nowrap;
        }
        table.yearly-stats th { background-color: #f5f5f5; }
    </style>
</head>
<body>
<main>
    <h1>MLB チーム詳細</h1>
    <p th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>
    <section th:if="${teamProfile != null}">
        <h2 th:text="${teamProfile.name}"></h2>
        <dl>
            <dt>チームID</dt><dd th:text="${teamProfile.teamId}"></dd>
            <dt>略称</dt><dd th:text="${teamProfile.abbreviation}"></dd>
            <dt>リーグ</dt><dd th:text="${teamProfile.league}"></dd>
            <dt>地区</dt><dd th:text="${teamProfile.division}"></dd>
            <dt>本拠地</dt><dd th:text="${teamProfile.venue}"></dd>
        </dl>
    </section>
    <section>
        <h2>年度別選手一覧</h2>
        <form method="get" th:action="@{/mlb/team/{teamId}(teamId=${teamId})}">
            <label for="season">年度：</label>
            <input type="number" id="season" name="season" min="1876"
                   th:max="${currentYear}" th:value="${season}" step="1" required>
            <input th:if="${gamePk != null}" type="hidden" name="gamePk" th:value="${gamePk}">
            <input th:if="${targetDate != null}" type="hidden" name="targetDate" th:value="${targetDate}">
            <button type="submit">表示</button>
        </form>
        <p th:if="${rosterErrorMessage != null}" th:text="${rosterErrorMessage}" role="alert"></p>
        <th:block th:if="${rosterPlayers != null}">
            <p th:if="${#lists.isEmpty(rosterPlayers)}">指定年度の選手情報がありません。</p>
            <div class="table-scroll" th:unless="${#lists.isEmpty(rosterPlayers)}">
                <table class="yearly-stats">
                    <thead><tr><th scope="col">背番号</th><th scope="col">選手名</th><th scope="col">ポジション</th></tr></thead>
                    <tbody>
                        <tr th:each="player : ${rosterPlayers}">
                            <td th:text="${player.jerseyNumber}"></td>
                            <td>
                                <a th:if="${player.playerId != null and player.playerId > 0}"
                                   th:href="@{/mlb/player/{playerId}(playerId=${player.playerId}, teamId=${teamId}, season=${season}, gamePk=${gamePk}, targetDate=${targetDate})}"
                                   th:text="${player.playerName}"></a>
                                <span th:unless="${player.playerId != null and player.playerId > 0}"
                                      th:text="${player.playerName}"></span>
                            </td>
                            <td th:text="${player.position}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
    </section>
    <a th:if="${gamePk != null}"
       th:href="@{/mlb/game/{gamePk}(gamePk=${gamePk}, targetDate=${targetDate})}">← 試合詳細へ戻る</a>
    <a th:if="${gamePk == null}" th:href="@{/mlb}">← 試合一覧へ戻る</a>
</main>
</body>
</html>
