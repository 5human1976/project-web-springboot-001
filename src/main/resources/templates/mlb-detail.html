<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 試合詳細</title>
    <style>
        body {
            font-family: sans-serif;
            color: #222;
            background-color: #fff;
            margin: 24px;
        }

        .status {
            display: inline-block;
            background-color: #f2f2f2;
            padding: 6px 12px;
            margin-top: 0;
        }

        .matchup {
            max-width: 560px;
            margin: 12px 0 24px;
        }

        .team-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            font-size: 1.25rem;
        }

        .score {
            font-size: 1.75rem;
            font-weight: bold;
        }

        .versus {
            text-align: center;
            color: #666;
            margin: 8px 0;
        }

        table {
            border-collapse: collapse;
            margin: 16px 0 24px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: center;
        }

        thead th {
            background-color: #f2f2f2;
        }

        .team-name {
            text-align: left;
        }

        .total {
            background-color: #f5f5f5;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main>
        <h1>MLB 試合詳細</h1>
        <section th:if="${gameDetail != null}">
            <p>gamePk：<span th:text="${gameDetail.gamePk}"></span></p>
            <p class="status" th:text="${gameDetail.status}"></p>
            <div class="matchup">
                <div class="team-score">
                    <span th:text="${gameDetail.awayTeam}"></span>
                    <span class="score" th:text="${gameDetail.awayScore != null ? gameDetail.awayScore : '-'}"></span>
                </div>
                <p class="versus">VS</p>
                <div class="team-score">
                    <span th:text="${gameDetail.homeTeam}"></span>
                    <span class="score" th:text="${gameDetail.homeScore != null ? gameDetail.homeScore : '-'}"></span>
                </div>
            </div>
            <p>開始日時：<span th:text="${gameDetail.gameDateJst}"></span> JST</p>
            <p>球場：<span th:text="${gameDetail.venue}"></span></p>
            <h2>スコアボード</h2>
            <p th:if="${#lists.isEmpty(gameDetail.innings)}">イニング別スコアはまだありません。</p>
            <table th:if="${!#lists.isEmpty(gameDetail.innings)}">
                <thead>
                    <tr>
                        <th scope="col" class="team-name">チーム名</th>
                        <th scope="col" th:each="inning : ${gameDetail.innings}" th:text="${inning.inning}"></th>
                        <th scope="col" class="total">R</th>
                        <th scope="col" class="total">H</th>
                        <th scope="col" class="total">E</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row" class="team-name" th:text="${gameDetail.awayTeam}"></th>
                        <td th:each="inning : ${gameDetail.innings}"
                            th:text="${inning.awayRuns != null ? inning.awayRuns : '-'}"></td>
                        <td class="total" th:text="${gameDetail.awayScore != null ? gameDetail.awayScore : '-'}"></td>
                        <td class="total" th:text="${gameDetail.awayHits != null ? gameDetail.awayHits : '-'}"></td>
                        <td class="total" th:text="${gameDetail.awayErrors != null ? gameDetail.awayErrors : '-'}"></td>
                    </tr>
                    <tr>
                        <th scope="row" class="team-name" th:text="${gameDetail.homeTeam}"></th>
                        <td th:each="inning : ${gameDetail.innings}"
                            th:text="${inning.homeRuns != null ? inning.homeRuns : '-'}"></td>
                        <td class="total" th:text="${gameDetail.homeScore != null ? gameDetail.homeScore : '-'}"></td>
                        <td class="total" th:text="${gameDetail.homeHits != null ? gameDetail.homeHits : '-'}"></td>
                        <td class="total" th:text="${gameDetail.homeErrors != null ? gameDetail.homeErrors : '-'}"></td>
                    </tr>
                </tbody>
            </table>
            <h2>投手結果</h2>
            <p>勝利投手：<span th:text="${gameDetail.winningPitcher}"></span></p>
            <p>敗戦投手：<span th:text="${gameDetail.losingPitcher}"></span></p>
            <p>セーブ：<span th:text="${gameDetail.savePitcher}"></span></p>
        </section>
        <p th:if="${errorMessage != null}">gamePk：<span th:text="${gamePk}"></span></p>
        <p th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
        <a th:if="${targetDate != null}" th:href="@{/mlb(targetDate=${targetDate})}">← 試合一覧へ戻る</a>
        <a th:if="${targetDate == null}" th:href="@{/mlb}">← 試合一覧へ戻る</a>
    </main>
</body>

</html>
