<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLB レギュラーシーズン順位表</title>
    <style>
        .league { margin: 32px 0 40px; }
        .division { margin-bottom: 24px; }
        .table-scroll { overflow-x: auto; }
        table { border-collapse: collapse; }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: center;
            white-space: nowrap;
        }
        thead th { background-color: #f5f5f5; }
        .team-name { text-align: left; }
    </style>
</head>
<body>
<main>
    <h1>MLB レギュラーシーズン順位表</h1>
    <p><span th:text="${season}"></span>年シーズン</p>
    <p th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert"></p>
    <th:block th:if="${divisions != null}">
        <p th:if="${#lists.isEmpty(divisions)}">順位情報がありません。</p>
        <section class="league" th:each="leagueId : ${ {103, 104} }">
            <h2 th:text="${leagueId == 103 ? 'アメリカンリーグ' : 'ナショナルリーグ'}"></h2>
            <section class="division" th:each="division : ${divisions}" th:if="${division.leagueId == leagueId}">
                <h3 th:text="${division.divisionName}"></h3>
                <p th:if="${#lists.isEmpty(division.teams)}">この地区の順位情報がありません。</p>
                <div class="table-scroll" th:unless="${#lists.isEmpty(division.teams)}">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">順位</th>
                                <th scope="col" class="team-name">チーム名</th>
                                <th scope="col">勝</th>
                                <th scope="col">敗</th>
                                <th scope="col">勝率</th>
                                <th scope="col">ゲーム差</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="team : ${division.teams}">
                                <td th:text="${team.divisionRank != null ? team.divisionRank : '-'}"></td>
                                <th scope="row" class="team-name" th:text="${team.teamName}"></th>
                                <td th:text="${team.wins != null ? team.wins : '-'}"></td>
                                <td th:text="${team.losses != null ? team.losses : '-'}"></td>
                                <td th:text="${team.winningPercentage}"></td>
                                <td th:text="${team.gamesBack}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </th:block>
    <a th:href="@{/mlb}">← 試合一覧へ戻る</a>
</main>
</body>
</html>
